<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="robots" content="noindex,nofollow">
  <title>Search</title>
  <link rel="manifest" href="/manifest.webmanifest?v=22" crossorigin="use-credentials">
  <link rel="stylesheet" href="/styles.css?v=26">
</head>
<body>
  <header class="topbar">
    <div class="brand">SEARCH</div>
    <span class="badge">DEV</span>
  </header>

  <main class="shell">
    <section class="hero search-panel">
      <h1>Find content. Skip the noise.</h1>
      <form id="search-form" class="searchbox">
        <input id="q" name="q" type="search" maxlength="200" autocomplete="off" placeholder="Search…" autofocus>
        <button type="submit">Search</button>
      </form>

      <div class="filters filter-strip">
        <select id="sort" aria-label="Sort">
          <option value="relevance">Relevance</option>
          <option value="newest">Newest</option>
          <option value="views">Most viewed</option>
          <option value="rating">Best rated</option>
          <option value="longest">Longest</option>
          <option value="shortest">Shortest</option>
        </select>
        <select id="content-class" aria-label="Content type">
          <option value="">All content types</option>
          <option value="amateur">Amateur</option>
          <option value="studio">Studio</option>
          <option value="unknown">Unknown</option>
        </select>
        <select id="provider" aria-label="Provider"><option value="">All sources</option></select>
        <select id="quality" aria-label="Quality">
          <option value="">Any quality</option>
          <option>360p</option>
          <option>480p</option>
          <option>720p</option>
          <option>1080p</option>
          <option>HD</option>
          <option>4K</option>
        </select>
        <select id="duration" aria-label="Duration">
          <option value="">Any length</option>
          <option value="0:600">Under 10 min</option>
          <option value="600:1800">10–30 min</option>
          <option value="1800:">30+ min</option>
        </select>
        <select id="age-check" aria-label="Age check">
          <option value="">Any observed age check</option>
          <option value="required">Observed age check</option>
          <option value="not_required">Observed no age check</option>
          <option value="unknown">Observed behavior unknown</option>
        </select>
      </div>
    </section>

    <section class="statusbar">
      <div class="status-copy">
        <span id="status" class="result-summary">Ready</span>
        <span id="live-detail" class="live-detail"></span>
      </div>
      <button id="clear" class="ghost" type="button">Clear</button>
    </section>

    <section id="results" class="grid" aria-live="polite"></section>
    <div class="more-row">
      <button id="more" class="more" type="button" hidden>Show more</button>
    </div>
  </main>

  <template id="card-template">
    <article class="card">
      <a class="thumb">
        <img class="preview" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" hidden>
        <video class="motion-preview" muted loop playsinline preload="none" referrerpolicy="no-referrer" hidden></video>
        <div class="placeholder">Preview</div>
        <div class="media-badges">
          <span class="quality"></span>
          <span class="duration"></span>
        </div>
        <button class="preview-toggle" type="button" aria-label="Play preview" aria-pressed="false" hidden>▶</button>
      </a>
      <div class="meta">
        <div class="card-meta-primary"><a class="title"></a></div>
        <div class="subline card-meta-secondary">
          <span class="source"></span>
          <span class="published"></span>
          <span class="views"></span>
          <span class="rating"></span>
          <span class="content-class"></span>
          <span class="studio"></span>
          <span class="age-check"></span>
          <span class="alternates"></span>
        </div>
      </div>
    </article>
  </template>

  <script src="/app.js?v=26" defer></script>
</body>
</html>
