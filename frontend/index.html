<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10131b">
  <meta name="robots" content="noindex,nofollow">
  <title>Search — find your scene</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Search — home"><span class="brand-mark">S</span><span>SEARCH<span class="brand-dot">.</span></span></a>
    <span class="topbar-note">THE VIDEO INDEX</span>
  </header>

  <main class="shell">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow"><span class="signal"></span> YOUR NEXT FIND STARTS HERE</p>
        <h1>Find the scene.<br><em>Lose the noise.</em></h1>
        <p class="intro">Search across sources in one place. Every word you enter matters.</p>
      </div>
      <form id="search-form" class="searchbox">
        <label class="sr-only" for="q">Search videos</label>
        <input id="q" name="q" type="search" maxlength="200" autocomplete="off" placeholder="Search titles, tags, anything…" autofocus>
        <button type="submit">Search <span aria-hidden="true">↗</span></button>
      </form>

      <div class="filters" aria-label="Search filters">
        <select id="provider" aria-label="Provider"><option value="">All sources</option></select>
        <select id="quality" aria-label="Quality">
          <option value="">Any quality</option>
          <option>720p</option>
          <option>1080p</option>
          <option>4K</option>
        </select>
        <select id="duration" aria-label="Duration">
          <option value="">Any length</option>
          <option value="0:600">Under 10 min</option>
          <option value="600:1800">10–30 min</option>
          <option value="1800:">30+ min</option>
        </select>
      </div>
    </section>

    <section class="statusbar">
      <div><span class="results-label">RESULTS</span><span id="status" role="status" aria-live="polite">Ready to search</span></div>
      <button id="clear" class="ghost" type="button">Clear filters <span aria-hidden="true">×</span></button>
    </section>

    <section id="results" class="grid" aria-live="polite"></section>
    <div class="more-row">
      <button id="more" class="more" type="button" hidden>Show more results <span aria-hidden="true">↓</span></button>
    </div>
  </main>

  <template id="card-template">
    <article class="card">
      <a class="thumb">
        <img class="preview" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" hidden>
        <div class="placeholder"><span class="placeholder-glyph" aria-hidden="true">▶</span><span>Preview unavailable</span></div>
        <span class="duration"></span>
      </a>
      <div class="meta">
        <a class="title"></a>
        <div class="subline">
          <span class="source"></span>
          <span class="quality"></span>
          <span class="alternates"></span>
        </div>
      </div>
    </article>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
